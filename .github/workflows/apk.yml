name: Compilar APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: if [ -f PMDL-Editor.zip ]; then unzip -o PMDL-Editor.zip; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PMDL-Editor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PMDL-Editor-APK
          path: PMDL-Editor.apk
